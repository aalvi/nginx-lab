apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app3
  namespace: gateway-lab
spec:
  parentRefs:
    - name: lab
  hostnames:
    - app3.localhost
  rules:
    - backendRefs:
        - name: app3
          port: 80
