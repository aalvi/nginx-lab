apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
  namespace: lab
spec:
  ingressClassName: nginx
  rules:
    - host: app1.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app1, port: { number: 80 } }
    - host: app2.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app2, port: { number: 80 } }
