apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aalvi/nginx-lab.git
    targetRevision: main
    path: gateway-apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
