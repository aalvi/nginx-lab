apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/nginx/charts
    chart: nginx-ingress
    targetRevision: 2.8.0
    helm:
      valuesObject:
        controller:
          replicaCount: 1
          config:
            entries:
              # NodePort has no load balancer address. Reporting the node IP lets the
              # Ingress publish an address, which Argo CD needs to mark it Healthy.
              external-status-address: 192.168.5.15
          ingressClass:
            name: nginx
            setAsDefaultIngress: true
          service:
            type: NodePort
            httpPort:
              nodePort: 30080
            httpsPort:
              nodePort: 30443
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
